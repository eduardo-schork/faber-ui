version: 2

updates:
  # Workspace dependencies. Minor and patch updates arrive together to keep the noise down.
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Workflow actions are pinned to commit hashes; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
