name: Release

on:
  push:
    branches: [master]

# No default permissions; each job below asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens or updates the "version packages" pull request while changesets are pending.
  version:
    if: github.repository == 'eduardo-schork/faber-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.pending.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: bun run version:packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Versions that are in the repository and not on the registry are waiting to be published.
      - name: List unpublished versions
        id: pending
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          packages="$(node scripts/publish-packages.mjs --list-pending | tr '\n' ' ')"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Unpublished: ${packages:-none}"

  # Stages the new versions through npm Trusted Publishing: no token is stored, provenance is
  # automatic, and nothing goes live until a maintainer approves it on npmjs.com.
  # Runs only after the repository variable NPM_PUBLISH_ENABLED is set to "true", which is done
  # once the packages exist on npm and each one trusts this workflow.
  publish:
    needs: version
    if: needs.version.outputs.pending != '' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check quality
        run: |
          bun run lint
          bun run typecheck
          bun run test

      # Versions are staged, not published: a maintainer approves each one on npmjs.com.
      - name: Build and stage
        run: bun run release:stage

      - name: Push release tags
        run: git push --tags
