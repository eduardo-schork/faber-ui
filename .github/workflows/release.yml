name: Release

on:
  push:
    branches: [master]

# No default permissions; each job below asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens or updates the "version packages" pull request while changesets are pending.
  version:
    if: github.repository == 'eduardo-schork/faber-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.pending.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: bun run version:packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Versions that are in the repository and not on the registry are waiting to be published.
      - name: List unpublished versions
        id: pending
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          packages="$(node scripts/publish-packages.mjs --list-pending | tr '\n' ' ')"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Unpublished: ${packages:-none}"

  # Stages the new versions through npm Trusted Publishing: no token is stored, provenance is
  # automatic, and nothing goes live until a maintainer approves it on npmjs.com.
  # Runs only after the repository variable NPM_PUBLISH_ENABLED is set to "true", which is done
  # once the packages exist on npm and each one trusts this workflow.
  publish:
    needs: version
    if: needs.version.outputs.pending != '' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      # The full history brings the existing tags, so only the new versions are tagged.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check quality
        run: |
          bun run lint
          bun run typecheck
          bun run test

      # `changeset tag` writes annotated tags, which need a tagger. Without one `git tag` fails,
      # changesets ignores it, and the job used to pass without pushing anything.
      - name: Set the tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Versions are staged, not published: a maintainer approves each one on npmjs.com.
      - name: Build and stage
        run: bun run release:stage

      # Fails when a version in the repository still has no tag on the remote.
      - name: Push release tags
        run: |
          git push --tags
          node scripts/publish-packages.mjs --check-tags
