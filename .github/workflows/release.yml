name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens or updates the "version packages" pull request while changesets are pending.
  version:
    if: github.repository == 'eduardo-schork/faber-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.pending.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version:packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Versions that are in the repository and not on the registry are waiting to be published.
      - name: List unpublished versions
        id: pending
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          packages="$(node scripts/publish-packages.mjs --list-pending | tr '\n' ' ')"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Unpublished: ${packages:-none}"

  # Publishes through npm Trusted Publishing: no token is stored, and provenance is automatic.
  # Runs only after the repository variable NPM_PUBLISH_ENABLED is set to "true", which is done
  # once the packages exist on npm and each one trusts this workflow.
  publish:
    needs: version
    if: needs.version.outputs.pending != '' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check quality
        run: |
          bun run lint
          bun run typecheck
          bun run test

      - name: Build and publish
        run: bun run release

      - name: Push release tags
        run: git push --tags
