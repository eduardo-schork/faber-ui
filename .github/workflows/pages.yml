name: Pages

# Publishes the website and Storybook to GitHub Pages. Enable it once under
# Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Each job asks for what it needs; the build cannot deploy.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'eduardo-schork/faber-ui'
    runs-on: ubuntu-latest
    env:
      FABER_UI_STATIC_EXPORT: 'true'
      FABER_UI_BASE_PATH: /faber-ui
      NEXT_PUBLIC_STORYBOOK_URL: https://eduardo-schork.github.io/faber-ui/storybook
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the website and Storybook
        run: bun run build

      - name: Place Storybook under the website
        run: |
          cp -R apps/storybook/storybook-static apps/website/out/storybook
          touch apps/website/out/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
